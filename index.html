<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LedgerIQ — Automated Expense Tracker with OCR & Predictive Analytics</title>
    <meta
      name="description"
      content="Track Smarter. Predict Spending. Save Better. Full-stack personal finance management with OCR receipt parsing, 30-day time-series expense forecasting, ML categorization, and AI financial assistant."
    />
    <meta property="og:title" content="LedgerIQ — Automated Expense Tracker with OCR & Predictive Analytics" />
    <meta
      property="og:description"
      content="Track Smarter. Predict Spending. Save Better. Full-stack personal finance management with OCR receipt parsing, 30-day predictive analytics, and AI financial insights."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ledgeriq_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-blue-500/30 selection:text-blue-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
